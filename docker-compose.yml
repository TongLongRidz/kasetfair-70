services:
  # PostgreSQL Database Service
  postgres:
    image: postgres:16-alpine
    container_name: kaset_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: kaset_db
      POSTGRES_USER: kaset_user
      POSTGRES_PASSWORD: kaset_secret_pass
    ports:
      - "5488:5432" # Custom non-default host port shifted to 5488
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kaset_user -d kaset_db"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - kaset_network

  # Redis In-Memory Store Service
  redis:
    image: redis:7-alpine
    container_name: kaset_redis
    restart: unless-stopped
    ports:
      - "6389:6379" # Custom non-default host port shifted to 6389
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - kaset_network

  # Go Backend API Service
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: kaset_backend
    restart: unless-stopped
    environment:
      PORT: "8585"
      APP_ENV: production
      DB_HOST: postgres
      DB_PORT: "5432"
      DB_USER: kaset_user
      DB_PASSWORD: kaset_secret_pass
      DB_NAME: kaset_db
      DB_SSLMODE: disable
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      REDIS_PASSWORD: ""
    ports:
      - "8585:8585" # Custom backend port shifted to 8585
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - kaset_network

  # Next.js Frontend Service
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: kaset_frontend
    restart: unless-stopped
    environment:
      PORT: "3050"
      NEXT_PUBLIC_API_URL: http://localhost:8585
    ports:
      - "3050:3050" # Custom frontend port shifted to 3050
    depends_on:
      - backend
    networks:
      - kaset_network

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local

networks:
  kaset_network:
    driver: bridge
